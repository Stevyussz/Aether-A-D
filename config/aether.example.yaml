# AETHER A&D — EXAMPLE configuration.
#
# The real IONIC/competition environment is UNKNOWN until the organizer briefing.
# Every value below is a PLACEHOLDER. Copy this file to config/aether.yaml and fill in
# official values. AETHER FAILS CLOSED: with enforce=true and no real targets, nothing runs.
#
#   cp config/aether.example.yaml config/aether.yaml
#   # edit config/aether.yaml with official scope
#   aether config validate

engine:
  max_concurrency: 8        # bounded concurrency (8GB RAM dev box: keep modest)
  default_timeout: 30.0     # seconds, per module
  state_db: runtime/aether.sqlite
  log_file: runtime/aether.log
  log_level: INFO

scope:
  enforce: true             # NEVER set false during competition
  targets:
    # --- Opponent services we are AUTHORIZED to attack (fill from official scope) ---
    - name: opponent-web-PLACEHOLDER
      host: CHANGEME         # e.g. 10.60.3.1  (placeholder -> config validate will fail)
      ports: [80, 443]
      kind: web
      owner: opponent
    # --- Our own services we DEFEND ---
    - name: our-web-PLACEHOLDER
      host: CHANGEME         # e.g. 10.60.OURTEAM.1
      ports: [80]
      kind: web
      owner: self
      notes: ""              # local path to our service directory (e.g. /var/www/html)

flags:
  # Official IONIC flag format. Accepts any non-empty payload inside the braces so no
  # valid flag is ever missed; tighten only if the briefing says the payload is restricted.
  pattern: "IONIC\\{[^}]+\\}"
  auto_submit: false        # MUST stay false — AETHER never auto-submits.

scoring:
  tick_seconds: null        # official round/tick length, once known (e.g. 120)
  epoch: null               # unix timestamp of tick 0 start, if known
  expiry_ticks: null        # flag validity window in ticks, if known
  flag_id_endpoint: null    # URL or local file path publishing per-tick flag_ids (if provided)
  flag_id_headers: null     # auth headers for a private flag_id endpoint, e.g. {X-Team-Token: "abc123"}
  targets_endpoint: null    # game Targets API (live opponent IP:port roster), e.g.
                            #   https://finals.tccpens.id/api/Game/2/Ad/Targets
                            # `aether attack farm` polls it each tick; auth reuses submission.token
  submit_endpoint: null     # informational mirror of submission.endpoint below
  scoreboard_endpoint: null

# Official flag SUBMISSION to the organizer game server (the one real A&D channel that sends
# flags out). FAIL-CLOSED: enabled=false by default — AETHER sends nothing until you set this
# with the briefing's real protocol. This is NOT an attack and never uses scope; it only talks
# to the official submission endpoint. Flags are only sent if VALIDATED, and each is marked so
# it is never submitted twice. Run it with:  aether flags submit   (or the dashboard button).
# Known-path flag harvester — the A&D exploit farm. Once you know the flag-exposing request for
# a service, add it here: `aether attack farm` fires it at EVERY opponent each tick, extracts the
# flag, and auto-submits it. Placeholders {ip}/{host}/{port} are substituted per target.
harvest:
  enabled: true
  paths: []
    # - "/index.php?page=/home/mahasiswa/flag.txt"     # e.g. an LFI that exposes the round flag
    # - "/download?file=/root/flag.txt"

submission:
  enabled: false            # set true ONLY with the official endpoint below filled in
  protocol: http            # "http" (one request per flag) | "tcp" (send "<flag>\n", read reply)
  # --- http protocol ---
  endpoint: null            # e.g. http://10.10.0.1/api/submit  (official game server URL)
  http_method: POST
  http_body: json           # "json" {flag_field: "<flag>"} | "form" | "raw" (flag as body)
  flag_field: flag          # body field; with batch=true this is the ARRAY field, e.g. "flags"
  batch: false              # true: POST ALL flags in ONE request {flag_field:[...]} (game-API style),
                            #       and read per-flag status from the JSON "results" array
  token: null               # team/submission token; for Bearer APIs set "Bearer <your-token>"
  token_header: null        # header to carry the token, e.g. X-Team-Token  or  Authorization
  # --- tcp protocol (classic line submitter) ---
  tcp_host: null            # e.g. 10.10.0.1
  tcp_port: null            # e.g. 31337
  timeout: 10.0
  # Response classification (case-insensitive substrings). Leave null to use sane defaults;
  # override once you see the real game-server replies.
  accepted_patterns: null   # e.g. ["accepted", "correct"]
  duplicate_patterns: null  # e.g. ["already", "duplicate"]  (treated as accepted/done)
  expired_patterns: null    # e.g. ["expired", "too old"]
  rejected_patterns: null   # e.g. ["invalid", "wrong"]
