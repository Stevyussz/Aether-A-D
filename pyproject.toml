[project]
name = "aether-ad"
version = "0.1.0"
description = "AETHER A&D — competition-grade Attack & Defense CTF framework (no AI runtime)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary — competition use" }
authors = [{ name = "Stev" }]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
aether = "aether.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "regression: regression tests",
    "stress: stress/endurance tests",
]

[tool.coverage.run]
source = ["aether"]
branch = true
